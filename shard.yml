name: pasto
version: 0.9.1

authors:
  - ralsina <ralsina@kde.org>

crystal: 1.13.0

license: MIT

dependencies:
  kemal:
    github: kemalcr/kemal
  kemal-session:
    github: kemalcr/kemal-session
  docopt-config:
    github: ralsina/docopt-config
  hansa:
    github: ralsina/hansa
  tartrazine:
    github: ralsina/tartrazine
  sepia:
    github: ralsina/sepia
  rate_limiter:
    github: ralsina/rate_limiter
  shirk:
    github: ralsina/shirk
  baked_file_handler:
    github: ralsina/baked_file_handler
  pasto-cache:
    github: ralsina/pasto-cache
  mcp:
    github: ralsina/mcp
        
targets:
  pasto:
    main: src/pasto.cr
  pasto-ssh:
    main: src/pasto_ssh.cr
  pasto-backup:
    main: src/pasto_backup.cr
  pasto-crypto:
    main: src/pasto_crypto.cr
  pasto-cli:
    main: src/pasto_cli.cr

executables:
  - pasto
  - pasto-ssh
  - pasto-backup
  - pasto-crypto
  - pasto-cli
